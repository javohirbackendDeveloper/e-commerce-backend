global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "api_gateway"
    static_configs:
      - targets: ["e_commerce-api_gateway-1:4000"]

  - job_name: "auth_service"
    metrics_path: /auth/metrics
    static_configs:
      - targets: ["e_commerce-api_gateway-1:4000"]

  - job_name: "order_service"
    metrics_path: /order/metrics
    static_configs:
      - targets: ["e_commerce-api_gateway-1:4000"]

  - job_name: "products_service"
    metrics_path: /products/metrics
    static_configs:
      - targets: ["e_commerce-api_gateway-1:4000"]
